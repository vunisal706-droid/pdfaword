<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>PDF a Markdown y Word</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --color-primary:#4f46e5;--color-primary-light:#e0e7ff;--color-primary-dark:#4338ca;--color-secondary:#ec4899;
  --color-bg:#ffffff;--color-surface:#f8fafc;--color-border:#e2e8f0;
  --color-text:#1e293b;--color-text-muted:#64748b;
  --color-success:#16a34a;--color-success-bg:#dcfce7;--color-error:#dc2626;--color-error-bg:#fee2e2;
  --color-warning:#d97706;--color-warning-bg:#fef3c7;
  --grad:linear-gradient(120deg,#2563eb,#7c3aed 45%,#ec4899);
  --glass:rgba(255,255,255,.78);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--color-text);background:#f5f7ff;overflow-x:hidden}
/* Fondo animado que va cambiando de color (siempre claro) */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:linear-gradient(125deg,#dbeafe,#ede9fe,#fce7f3,#fef9c3,#dcfce7,#cffafe,#dbeafe);background-size:400% 400%;animation:bgShift 24s ease-in-out infinite}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:float 18s ease-in-out infinite}
.bg i:nth-child(1){width:420px;height:420px;background:#93c5fd;top:-120px;left:-80px}
.bg i:nth-child(2){width:380px;height:380px;background:#f9a8d4;top:30%;right:-120px;animation-delay:-6s;animation-duration:22s}
.bg i:nth-child(3){width:340px;height:340px;background:#c4b5fd;bottom:-120px;left:25%;animation-delay:-12s;animation-duration:26s}
.bg i:nth-child(4){width:260px;height:260px;background:#fde68a;top:12%;left:45%;animation-delay:-3s;animation-duration:20s}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,40px) scale(1.1)}66%{transform:translate(-40px,30px) scale(.92)}}
.wrap{max-width:1100px;margin:0 auto;padding:32px 18px 48px}
header{display:flex;align-items:center;gap:18px;margin-bottom:26px;padding:20px 24px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.7);border-radius:24px;box-shadow:0 10px 40px rgba(79,70,229,.12)}
header img{width:64px;height:64px;border-radius:16px;box-shadow:0 6px 18px rgba(79,70,229,.25);animation:pop 4s ease-in-out infinite}
@keyframes pop{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(-4deg) scale(1.05)}}
h1{font-size:clamp(1.6rem,4.5vw,2.5rem);margin:0;font-weight:800;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:6px 0 0;color:var(--color-text-muted);font-size:1.02rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:99px;background:#fff;border:1px solid var(--color-border)}
.chip.pdf{color:#dc2626}.chip.md{color:#0f766e}.chip.w{color:#1d4ed8}
.drop{position:relative;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;padding:42px 20px;text-align:center;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.drop::before{content:"";position:absolute;inset:0;border-radius:24px;padding:3px;background:linear-gradient(90deg,#2563eb,#7c3aed,#ec4899,#f59e0b,#2563eb);background-size:300% 100%;animation:border 6s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
@keyframes border{to{background-position:300% 0}}
.drop:hover,.drop.over{transform:translateY(-3px);box-shadow:0 16px 40px rgba(79,70,229,.2)}
.drop .ic{width:76px;height:76px;margin:0 auto;border-radius:22px;display:grid;place-items:center;background:var(--grad);box-shadow:0 10px 24px rgba(124,58,237,.35);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.drop strong{display:block;font-size:1.2rem;margin:14px 0 4px}
.drop span{color:var(--color-text-muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px 10px;margin:16px 0}
.opts label{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:44px;padding:6px 14px;background:var(--glass);border:1px solid rgba(255,255,255,.8);border-radius:99px;font-weight:600;font-size:.95rem;transition:background .15s}
.opts label:hover{background:#fff}
.opts input{width:20px;height:20px;accent-color:var(--color-primary)}
.status{display:none;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;margin:10px 0;font-weight:600}
.status.show{display:flex}
.status.info{background:var(--color-primary-light);color:var(--color-primary-dark)}
.status.ok{background:var(--color-success-bg);color:#166534}
.status.err{background:var(--color-error-bg);color:#991b1b}
.status.warn{background:var(--color-warning-bg);color:#92400e}
.bar{flex:1;height:10px;background:#fff;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--grad);transition:width .2s}
.result{display:none;margin-top:14px}
.files{display:none;margin:14px 0}
.files.show{display:block}
.files-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.files-head h2{font-size:1.1rem;margin:0 auto 0 0}
.file-list{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.file-item{display:flex;align-items:center;gap:8px;background:var(--glass);backdrop-filter:blur(10px);border:1.5px solid rgba(255,255,255,.9);border-radius:16px;padding:6px 6px 6px 14px;transition:transform .15s,box-shadow .15s}
.file-item:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.file-item.active{border-color:var(--color-primary);background:#fff;box-shadow:0 8px 24px rgba(79,70,229,.18)}
.file-item button.sel{flex:1;min-width:0;text-align:left;background:none;border:0;font:inherit;cursor:pointer;min-height:44px;color:var(--color-text)}
.file-item .name{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item .st{display:block;font-size:.85rem;color:var(--color-text-muted)}
.file-item .st.err{color:var(--color-error)}.file-item .st.ok{color:#166534}.file-item .st.warn{color:#92400e}
.file-item .del{width:44px;height:44px;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--color-text-muted);font-size:1.1rem}
.file-item .del:hover{background:var(--color-error-bg);color:var(--color-error)}
.result.show{display:block;animation:fadeInUp .3s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tabs{display:flex;background:var(--glass);border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:4px;margin-right:auto}
.tab{border:0;background:none;padding:10px 18px;border-radius:10px;font:inherit;font-weight:700;color:var(--color-text-muted);cursor:pointer;min-height:44px}
.tab[aria-selected=true]{background:#fff;color:var(--color-primary);box-shadow:0 2px 8px rgba(79,70,229,.15)}
.btn{border:0;border-radius:14px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;min-height:44px;background:var(--grad);background-size:150% 100%;color:#fff;box-shadow:0 6px 16px rgba(124,58,237,.3);transition:transform .1s,background-position .3s,box-shadow .2s}
.btn:hover{background-position:100% 0;box-shadow:0 8px 22px rgba(124,58,237,.4)}
.btn.sec{background:#fff;color:var(--color-primary);border:1.5px solid #c7d2fe;box-shadow:none}
.btn.sec:hover{background:var(--color-primary-light)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--color-primary);outline-offset:3px}
.panel{background:#fff;border:1px solid rgba(255,255,255,.9);border-radius:20px;box-shadow:0 12px 40px rgba(79,70,229,.1);overflow:hidden}
textarea{width:100%;min-height:60vh;border:0;padding:20px;font:14px/1.6 'JetBrains Mono',ui-monospace,monospace;color:var(--color-text);resize:vertical}
textarea:focus{outline:none}
.preview{padding:28px 36px;min-height:60vh;line-height:1.55;overflow-x:auto}
.preview h1,.preview h2,.preview h3{line-height:1.25}
.preview img{max-width:100%;height:auto;display:block;margin:12px auto;border-radius:6px}
.preview table{border-collapse:collapse}.preview td,.preview th{border:1px solid var(--color-border);padding:6px 10px}
.meta{color:var(--color-text-muted);font-size:.9rem;margin-top:8px}
.credit{margin-top:44px;text-align:center}
.credit small{display:block;font-size:.9rem;color:var(--color-text-muted);font-weight:600;letter-spacing:.04em}
.credit strong{display:inline-block;margin-top:4px;font-size:clamp(1.4rem,4vw,2rem);font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#fff;color:#166534;border:2px solid var(--color-success);padding:12px 20px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.12);transition:transform .25s}
.toast.show{transform:translateX(-50%) translateY(0)}
[hidden]{display:none!important}
@media (max-width:600px){header{flex-direction:column;text-align:center}.chips{justify-content:center}.preview{padding:20px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <header>
    <img src="icon-192.png" width="64" height="64" alt="">
    <div>
      <h1>PDF a Markdown y Word</h1>
      <p>Convierte tus PDF conservando títulos, listas, tablas, colores e imágenes. Todo se procesa en tu dispositivo.</p>
      <div class="chips" aria-hidden="true"><span class="chip pdf">PDF</span><span class="chip">→</span><span class="chip md">Markdown</span><span class="chip w">Word</span></div>
    </div>
  </header>

  <div class="drop" id="drop" role="button" tabindex="0" aria-label="Seleccionar archivo PDF">
    <div class="ic"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6M9 15l3-3 3 3"/></svg></div>
    <strong>Arrastra aquí uno o varios PDF o pulsa para elegirlos</strong>
    <span>Funciona con PDF de texto (no escaneados)</span>
    <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
  </div>

  <div class="opts">
    <label for="optFmt"><input type="checkbox" id="optFmt" checked> Conservar colores, tamaños y fuentes</label>
    <label for="optHead"><input type="checkbox" id="optHead" checked> Detectar títulos</label>
    <label for="optHF"><input type="checkbox" id="optHF" checked> Quitar encabezados y pies repetidos</label>
    <label for="optPages"><input type="checkbox" id="optPages"> Separar páginas</label>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"><span id="statusText"></span><div class="bar" id="bar" hidden><i id="barFill"></i></div></div>

  <section class="files" id="files" aria-label="Archivos">
    <div class="files-head">
      <h2 id="filesTitle">Archivos</h2>
      <button class="btn sec" id="btnZipMd">Todo en .md (ZIP)</button>
      <button class="btn" id="btnZipDocx">Todo en Word (ZIP)</button>
      <button class="btn sec" id="btnClear">Vaciar lista</button>
    </div>
    <ul class="file-list" id="fileList"></ul>
  </section>

  <section class="result" id="result">
    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" id="tabMd">Markdown</button>
        <button class="tab" role="tab" aria-selected="false" id="tabPrev">Vista previa</button>
      </div>
      <button class="btn sec" id="btnCopy">Copiar</button>
      <button class="btn sec" id="btnDown">Descargar .md</button>
      <button class="btn" id="btnDocx">Descargar Word</button>
    </div>
    <div class="panel">
      <textarea id="out" aria-label="Resultado en Markdown (editable)" spellcheck="false"></textarea>
      <div class="preview" id="preview" hidden></div>
    </div>
    <div class="meta" id="meta"></div>
  </section>
  <footer class="credit"><small>Creada por</small><strong>Víctor Manuel Única Salas</strong></footer>
</div>
<div class="toast" id="toast" role="alert"></div>

<script>
const PDF_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
const STD_FONTS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/';
// Worker desde blob: evita el bloqueo de workers de otro dominio en algunos navegadores
try {
  pdfjsLib.GlobalWorkerOptions.workerPort = new Worker(URL.createObjectURL(new Blob([`importScripts('${PDF_WORKER}');`], { type: 'text/javascript' })));
} catch (e) { console.warn('Worker por blob no disponible, se usa el normal', e); }
const $ = id => document.getElementById(id);
let fileName = 'documento';
const docs = []; let current = null, busy = false;

const drop = $('drop'), input = $('file');
drop.onclick = () => input.click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles([...e.dataTransfer.files]));
input.onchange = () => { addFiles([...input.files]); input.value = ''; };
['optHF','optPages','optHead','optFmt'].forEach(id => $(id).onchange = () => { docs.forEach(d => { if (d.buffer) d.state = 'pending'; }); processQueue(); });

function status(type, text, progress) {
  const s = $('status'); s.className = 'status show ' + type;
  const icons = { info: '⏳', ok: '✓', err: '✗', warn: '⚠' };
  $('statusText').textContent = icons[type] + ' ' + text;
  $('bar').hidden = progress === undefined;
  if (progress !== undefined) $('barFill').style.width = (progress * 100) + '%';
}

async function addFiles(files) {
  const pdfs = files.filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));
  if (!pdfs.length) return status('err', 'Ninguno de los archivos es un PDF.');
  if (pdfs.length < files.length) toast('⚠ Se han ignorado ' + (files.length - pdfs.length) + ' archivo(s) que no son PDF');
  for (const f of pdfs) {
    let name = f.name.replace(/\.pdf$/i, ''), base = name, n = 2;
    while (docs.some(d => d.name === name)) name = `${base} (${n++})`;
    docs.push({ id: Math.random().toString(36).slice(2), name, buffer: await f.arrayBuffer(), md: '', state: 'pending', info: 'En cola' });
  }
  renderList(); processQueue();
}

async function processQueue() {
  if (busy) return; busy = true; drop.style.pointerEvents = 'none';
  try {
    let d;
    while ((d = docs.find(x => x.state === 'pending'))) {
      d.state = 'working'; d.info = 'Convirtiendo…'; renderList();
      await convertDoc(d);
      if (!current || current === d.id) select(d.id);
      renderList();
    }
    const errs = docs.filter(x => x.state === 'err').length;
    if (docs.length) status(errs ? 'warn' : 'ok', docs.length === 1 ? (errs ? docs[0].info : `Convertido «${docs[0].name}.pdf»`) : `${docs.length - errs} de ${docs.length} archivos convertidos`);
  } finally { busy = false; drop.style.pointerEvents = ''; }
}

async function convertDoc(d) {
  const idx = docs.filter(x => x.state !== 'pending').length;
  try {
    let pdf;
    try { pdf = await pdfjsLib.getDocument({ data: d.buffer.slice(0), standardFontDataUrl: STD_FONTS }).promise; }
    catch (e) {
      if (e.name === 'PasswordException' || !pdfjsLib.GlobalWorkerOptions.workerPort) throw e;
      console.warn('Reintento sin worker por blob', e);
      pdfjsLib.GlobalWorkerOptions.workerPort = null;
      pdf = await pdfjsLib.getDocument({ data: d.buffer.slice(0), standardFontDataUrl: STD_FONTS }).promise;
    }
    const pages = []; d.images = {};
    for (let p = 1; p <= pdf.numPages; p++) {
      status('info', `«${d.name}» (${idx} de ${docs.length}) · página ${p} de ${pdf.numPages}`, p / pdf.numPages);
      const page = await pdf.getPage(p);
      pages.push(await pageLines(page, p, d));
    }
    try { d.md = toMarkdown(pages); }
    catch (e) {
      console.warn('Estructura no reconocida, se exporta texto plano', e);
      d.md = pages.map(ls => ls.filter(l => !l.image).map(l => l.text.replace(/\u0000\S*/g, '')).filter(Boolean).join('\n\n')).join('\n\n---\n\n') + '\n';
    }
    const words = d.md.split(/\s+/).filter(Boolean).length;
    d.meta = `${pdf.numPages} página(s) · ${words.toLocaleString('es')} palabras`;
    if (words < 5) { d.state = 'warn'; d.info = 'Sin texto (¿escaneado?)'; }
    else { d.state = 'ok'; d.info = d.meta; }
  } catch (e) {
    console.error(e);
    d.state = 'err'; d.md = '';
    d.info = e.name === 'PasswordException' ? 'Protegido con contraseña' : 'No se pudo leer: ' + (e.message || e.name || e).toString().slice(0, 90);
  }
}

function renderList() {
  $('files').classList.toggle('show', docs.length > 0);
  $('filesTitle').textContent = docs.length === 1 ? '1 archivo' : `${docs.length} archivos`;
  const many = docs.filter(d => d.md).length > 1;
  $('btnZipMd').hidden = $('btnZipDocx').hidden = !many;
  $('btnZipMd').disabled = $('btnZipDocx').disabled = busy;
  const icon = { ok: '✓', warn: '⚠', err: '✗', working: '⏳', pending: '•' };
  $('fileList').innerHTML = '';
  docs.forEach(d => {
    const li = document.createElement('li');
    li.className = 'file-item' + (d.id === current ? ' active' : '');
    const sel = document.createElement('button'); sel.className = 'sel';
    sel.innerHTML = '<span class="name"></span><span class="st"></span>';
    sel.querySelector('.name').textContent = d.name + '.pdf';
    const st = sel.querySelector('.st'); st.textContent = icon[d.state] + ' ' + d.info; st.classList.add(d.state);
    sel.disabled = !d.md; sel.onclick = () => select(d.id);
    sel.setAttribute('aria-current', d.id === current);
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '✕';
    del.setAttribute('aria-label', 'Quitar ' + d.name); del.disabled = d.state === 'working';
    del.onclick = () => removeDoc(d.id);
    li.append(sel, del); $('fileList').append(li);
  });
}

function select(id) {
  const d = docs.find(x => x.id === id); if (!d || !d.md) return;
  current = id; fileName = d.name;
  $('out').value = d.md; renderPreview();
  $('meta').textContent = `${d.name}.pdf · ${d.meta}`;
  $('result').classList.add('show'); renderList();
}

function removeDoc(id) {
  const i = docs.findIndex(x => x.id === id); if (i < 0) return;
  docs.splice(i, 1);
  if (current === id) { current = null; const next = docs.find(x => x.md); if (next) select(next.id); else { $('result').classList.remove('show'); $('status').className = 'status'; } }
  renderList();
}
$('btnClear').onclick = () => { if (busy) return; docs.length = 0; current = null; $('result').classList.remove('show'); $('status').className = 'status'; renderList(); };

// Agrupa fragmentos de texto en líneas
// Lee una página: tipos de letra, colores, líneas en orden de lectura e imágenes
async function pageLines(page, p, d) {
  let boxes = [], ops = null, rules = [];
  try { ops = await page.getOperatorList(); boxes = findImages(ops); } catch (e) { console.warn('Imágenes no detectadas en pág.', p, e); }
  try { if (ops) rules = findRules(ops); } catch (e) { console.warn('Líneas no detectadas en pág.', p, e); }
  const tc = await page.getTextContent();
  const fonts = {};
  await Promise.all(Object.keys(tc.styles || {}).map(k => Promise.race([
    new Promise(res => { try { page.commonObjs.get(k, f => res(f)); } catch (e) { res(null); } }),
    new Promise(res => setTimeout(() => res(null), 1500))
  ]).then(f => {
    const n = (f && f.name) || '';
    fonts[k] = {
      bold: !!(f && (f.bold || f.black)) || /bold|black|heavy|semibold|demi|,b$/i.test(n),
      italic: !!(f && f.italic) || /italic|oblique|,i$/i.test(n),
      fam: fontFamily(n)
    };
  })));
  const colors = ops ? colorize(tc.items, textColors(ops)) : [];
  const lines = buildLines(tc.items, fonts, colors);

    out.push({ table: true, rows: rows.map(r => r.filter((_, k) => keep[k])), widths, y: first.y, yBot: group[group.length - 1].y, x1: kc[0], x2: right, size: first.size, text: '\u0000tbl' });

  }

}

  zip.file('word/styles.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles ${W}><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="${font}" w:hAnsi="${font}" w:cs="${font}"/>${fmt ? `<w:color w:val="${fmt.color}"/>` : ''}<w:sz w:val="${size}"/><w:szCs w:val="${size}"/><w:lang w:val="es-ES"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="${fmt ? Math.round(fmt.space * 20) : 160}" w:line="${line}" w:lineRule="auto"/><w:jc w:val="${jc}"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>${h('Heading1','heading 1',36,'1D4ED8')}${h('Heading2','heading 2',30,'1E3A8A')}${h('Heading3','heading 3',26,'334155')}<w:style w:type="paragraph" w:styleId="ListParagraph"><w:name w:val="List Paragraph"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:after="${fmt ? Math.round(fmt.space * 6) : 60}"/><w:ind w:left="${Math.round(L.text * 20)}"/></w:pPr></w:style></w:styles>`);
  zip.file('word/numbering.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:numbering ${W}><w:abstractNum w:abstractNumId="0"><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="•"/><w:lvlJc w:val="left"/>${ind}</w:lvl><w:lvl w:ilvl="1"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="◦"/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="1440" w:hanging="360"/></w:pPr></w:lvl></w:abstractNum><w:abstractNum w:abstractNumId="1"><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="decimal"/><w:lvlText w:val="%1."/><w:lvlJc w:val="left"/>${ind}</w:lvl><w:lvl w:ilvl="1"><w:start w:val="1"/><w:numFmt w:val="lowerLetter"/><w:lvlText w:val="%2)"/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="1440" w:hanging="360"/></w:pPr></w:lvl></w:abstractNum><w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num><w:num w:numId="2"><w:abstractNumId w:val="1"/></w:num>${olStarts.map((st, k) => `<w:num w:numId="${k + 3}"><w:abstractNumId w:val="1"/><w:lvlOverride w:ilvl="0"><w:startOverride w:val="${st}"/></w:lvlOverride></w:num>`).join('')}</w:numbering>`);
  zip.file('word/document.xml', docXml);
  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

$('btnDocx').onclick = async () => {
  const btn = $('btnDocx'); btn.disabled = true; btn.textContent = 'Generando…';
  try {
    const d = curDoc(); const blob = await buildDocx($('out').value, d ? d.images : {});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = fileName + '.docx'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('✓ Descargado ' + fileName + '.docx');
  } catch (e) { console.error(e); status('err', 'No se pudo generar el Word.'); }
  finally { btn.disabled = false; btn.textContent = 'Descargar Word'; }
};

async function zipAll(kind) {
  const btn = kind === 'md' ? $('btnZipMd') : $('btnZipDocx'), label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Preparando…';
  try {
    const zip = new JSZip();
    for (const d of docs.filter(x => x.md)) zip.file(d.name + (kind === 'md' ? '.md' : '.docx'), kind === 'md' ? withImages(d.md, d) : await buildDocx(d.md, d.images || {}));
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = kind === 'md' ? 'pdf-a-markdown.zip' : 'pdf-a-word.zip'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('✓ Descargado ' + a.download);
  } catch (e) { console.error(e); status('err', 'No se pudo crear el ZIP.'); }
  finally { btn.disabled = false; btn.textContent = label; }
}
$('btnZipMd').onclick = () => zipAll('md');
$('btnZipDocx').onclick = () => zipAll('docx');

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
